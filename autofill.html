<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Router Pengeluaran & QC - Berasaskan Kumpulan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-before: always; break-before: page; }
            body { background-color: white; padding: 0; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans p-4 md:p-8 text-sm text-gray-800">

    <div class="max-w-7xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-slate-200 no-print mb-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-3 flex items-center gap-2">Meja Kerani Pengeluaran (Sistem Kumpulan)</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Nombor WOS *</label>
                <input type="text" id="wosNo" class="w-full mt-1 p-2 border border-gray-300 rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">No Batch</label>
                <input type="text" id="batchNo" class="w-full mt-1 p-2 border border-gray-300 rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Nama Mesin</label>
                <input type="text" id="namaMesin" class="w-full mt-1 p-2 border border-gray-300 rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Nama Projek *</label>
                <input type="text" id="namaProjek" class="w-full mt-1 p-2 border border-gray-300 rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Jenis Proses</label>
                <input type="text" id="jenisProses" class="w-full mt-1 p-2 border border-gray-300 rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Nama Produk *</label>
                <input type="text" id="namaProduk" class="w-full mt-1 p-2 border border-gray-300 rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Size Produk / Bil. Unit</label>
                <input type="text" id="sizeProduk" class="w-full mt-1 p-2 border border-gray-300 rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Tarikh</label>
                <input type="date" id="tarikhDoc" class="w-full mt-1 p-2 border border-gray-300 rounded bg-white" oninput="renderOutputs()">
            </div>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-slate-700">Pengurusan Kumpulan & Komponen</h2>
            <button onclick="addGroup()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 font-bold transition">
                Tambah Kumpulan Baru
            </button>
        </div>

        <div id="groupsContainer" class="space-y-6 mb-6">
            </div>

        <div class="flex flex-wrap gap-3 pt-4 border-t">
            <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-5 py-2.5 rounded-lg shadow hover:bg-emerald-700 font-semibold flex items-center gap-2">
                Eksport Semua ke Excel (.xlsx)
            </button>
            <button onclick="exportToPDF()" class="bg-rose-600 text-white px-5 py-2.5 rounded-lg shadow hover:bg-rose-700 font-semibold flex items-center gap-2">
                Muat Turun Cetakan PDF
            </button>
        </div>
    </div>

    <div id="printContainer" class="max-w-7xl mx-auto space-y-8">
        </div>

    <script>
        // Set tarikh hari ini secara automatik
        document.getElementById('tarikhDoc').value = new Date().toISOString().split('T')[0];

        let groupCounter = 0;

        // Fungsi menyemak ruangan wajib (Validation)
        function semakPengepalaWajib() {
            const wos = document.getElementById('wosNo').value.trim();
            const projek = document.getElementById('namaProjek').value.trim();
            const produk = document.getElementById('namaProduk').value.trim();

            if (!wos || !projek || !produk) {
                alert("RALAT: Sila isi bahagian Pengepala Utama yang wajib terlebih dahulu:\n- Nombor WOS\n- Nama Projek\n- Nama Produk");
                return false;
            }
            return true;
        }

        // Fungsi menambah Kumpulan Baru (Group) dengan input kosong bersih
        function addGroup(initialName = "") {
            groupCounter++;
            const currentId = groupCounter;
            const container = document.getElementById('groupsContainer');

            const groupDiv = document.createElement('div');
            groupDiv.id = `groupBlock_${currentId}`;
            groupDiv.className = "group-block bg-slate-50 p-4 rounded-xl border-2 border-slate-300 relative shadow-sm";

            groupDiv.innerHTML = `
                <div class="flex flex-wrap justify-between items-center gap-2 mb-3 bg-slate-200 p-2 rounded-lg">
                    <div class="flex items-center gap-2 w-full md:w-1/2">
                        <span class="text-slate-700 font-bold">KUMPULAN:</span>
                        <input type="text" value="${initialName}" placeholder="" 
                               class="group-title-input p-1.5 border border-gray-300 rounded bg-white font-bold text-slate-900 flex-grow uppercase" 
                               oninput="renderOutputs()">
                    </div>
                    <button onclick="deleteGroup(${currentId})" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded font-bold">
                        Buang Kumpulan Ini
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border bg-white rounded-lg overflow-hidden">
                        <thead>
                            <tr class="bg-slate-700 text-white text-xs uppercase">
                                <th class="p-2 border">Nama Komponen</th>
                                <th class="p-2 border w-24">P (mm)</th>
                                <th class="p-2 border w-24">L (mm)</th>
                                <th class="p-2 border w-24">T (mm)</th>
                                <th class="p-2 border w-24">KTI (Bil)</th>
                                <th class="p-2 border">Bahan</th>
                                <th class="p-2 border w-16 text-center">Padam</th>
                            </tr>
                        </thead>
                        <tbody id="componentRows_${currentId}">
                            </tbody>
                    </table>
                </div>
                <div class="mt-2">
                    <button onclick="addComponentToGroup(${currentId})" class="text-xs bg-slate-600 hover:bg-slate-700 text-white px-3 py-1.5 rounded font-semibold">
                        + Tambah Komponen Ke Dalam Kumpulan Ini
                    </button>
                </div>
            `;
            container.appendChild(groupDiv);
            renderOutputs();
            return currentId;
        }

        function deleteGroup(id) {
            if(confirm("Adakah anda pasti mahu membuang kumpulan ini bersama semua komponen di dalamnya?")) {
                document.getElementById(`groupBlock_${id}`).remove();
                renderOutputs();
            }
        }

        // Slot input kini kosong sepenuhnya tanpa nombor placeholder
        function addComponentToGroup(groupId, name="", p="", l="", t="", kti="", bahan="") {
            const tbody = document.getElementById(`componentRows_${groupId}`);
            const tr = document.createElement('tr');
            tr.className = 'comp-row';
            tr.innerHTML = `
                <td class="p-1 border"><input type="text" value="${name}" class="w-full p-1 border border-gray-300 rounded c-name" oninput="renderOutputs()"></td>
                <td class="p-1 border"><input type="number" value="${p}" class="w-full p-1 border border-gray-300 rounded c-p" oninput="renderOutputs()"></td>
                <td class="p-1 border"><input type="number" value="${l}" class="w-full p-1 border border-gray-300 rounded c-l" oninput="renderOutputs()"></td>
                <td class="p-1 border"><input type="number" value="${t}" class="w-full p-1 border border-gray-300 rounded c-t" oninput="renderOutputs()"></td>
                <td class="p-1 border"><input type="number" value="${kti}" class="w-full p-1 border border-gray-300 rounded c-kti" oninput="renderOutputs()"></td>
                <td class="p-1 border"><input type="text" value="${bahan}" class="w-full p-1 border border-gray-300 rounded c-bahan" oninput="renderOutputs()"></td>
                <td class="p-1 border text-center"><button onclick="deleteComponent(this)" class="text-red-500 hover:text-red-700 font-bold">✕</button></td>
            `;
            tbody.appendChild(tr);
            renderOutputs();
        }

        function deleteComponent(btn) {
            btn.closest('tr').remove();
            renderOutputs();
        }

        function buildHeaderHTML(wos, batch, mesin, projek, proses, produk, size, tarikh, pageNum, totalPages) {
            return `
                <div class="grid grid-cols-12 border border-black text-xs font-bold mb-4 bg-white p-2">
                    <div class="col-span-3 border-r border-b border-black p-1">WOS NO: <span class="font-normal">${wos}</span></div>
                    <div class="col-span-4 border-r border-b border-black p-1">PROJEK: <span class="font-normal">${projek}</span></div>
                    <div class="col-span-5 border-b border-black p-1">NAMA PROJEK: <span class="font-normal">${projek}</span></div>
                    
                    <div class="col-span-3 border-r border-b border-black p-1">BATCH NO: <span class="font-normal">${batch}</span></div>
                    <div class="col-span-4 border-r border-b border-black p-1">PROSES: <span class="font-normal">${proses}</span></div>
                    <div class="col-span-5 border-b border-black p-1">TARIKH: <span class="font-normal">${tarikh}</span></div>
                    
                    <div class="col-span-3 border-r border-black p-1">NAMA MESIN: <span class="font-normal">${mesin}</span></div>
                    <div class="col-span-4 border-r border-black p-1">NAMA PRODUK: <span class="font-normal">${produk}</span></div>
                    <div class="col-span-3 border-r border-black p-1">SAIZ / BIL UNIT: <span class="font-normal">${size}</span></div>
                    <div class="col-span-2 p-1 text-right">Muka Surat: <span class="font-normal">${pageNum} / ${totalPages}</span></div>
                </div>
            `;
        }

        function renderOutputs() {
            const container = document.getElementById('printContainer');
            container.innerHTML = '';

            const wos = document.getElementById('wosNo').value || '---';
            const batch = document.getElementById('batchNo').value || '---';
            const mesin = document.getElementById('namaMesin').value || '---';
            const projek = document.getElementById('namaProjek').value || '---';
            const proses = document.getElementById('jenisProses').value || '---';
            const produk = document.getElementById('namaProduk').value || '---';
            const size = document.getElementById('sizeProduk').value || '---';
            const tarikh = document.getElementById('tarikhDoc').value || '---';

            let flatComponentList = [];
            let globalCounter = 1;

            const groupBlocks = document.querySelectorAll('.group-block');
            
            groupBlocks.forEach(block => {
                const groupName = block.querySelector('.group-title-input').value.toUpperCase() || "AM";
                const compRows = block.querySelectorAll('.comp-row');
                
                if(compRows.length === 0) return;

                compRows.forEach(row => {
                    flatComponentList.push({
                        globalNo: globalCounter++,
                        group: groupName,
                        name: row.querySelector('.c-name').value || '---',
                        p: row.querySelector('.c-p').value || '-',
                        l: row.querySelector('.c-l').value || '-',
                        t: row.querySelector('.c-t').value || '-',
                        kti: row.querySelector('.c-kti').value || '0',
                        bahan: row.querySelector('.c-bahan').value || '-'
                    });
                });
            });

            if(flatComponentList.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 bg-white border rounded-xl">Tiada data komponen untuk dipaparkan. Sila tambah kumpulan dan komponen di atas.</div>`;
                return;
            }

            // --- JANA ROUTE SHEET (Maksimum 8 Baris Sekeping) ---
            const ITEMS_PER_PAGE = 8;
            const totalPages = Math.ceil(flatComponentList.length / ITEMS_PER_PAGE);

            for (let i = 0; i < totalPages; i++) {
                const pageNum = i + 1;
                const sliceStart = i * ITEMS_PER_PAGE;
                const pageItems = flatComponentList.slice(sliceStart, sliceStart + ITEMS_PER_PAGE);

                const sheetDiv = document.createElement('div');
                sheetDiv.className = `bg-white p-6 shadow-md border border-slate-300 rounded-lg ${i > 0 ? 'page-break' : ''}`;
                
                let tableRowsHTML = '';
                let currentGroupInPage = '';

                pageItems.forEach(item => {
                    if (item.group !== currentGroupInPage) {
                        tableRowsHTML += `
                            <tr class="bg-blue-50 font-bold text-xs">
                                <td colspan="9" class="border border-black px-2 py-1.5 text-blue-900 tracking-wider">KUMPULAN: ${item.group}</td>
                            </tr>
                        `;
                        currentGroupInPage = item.group;
                    }

                    tableRowsHTML += `
                        <tr class="text-xs">
                            <td class="border border-black p-2 text-center font-bold">${item.globalNo}</td>
                            <td class="border border-black p-2 font-medium">${item.name}</td>
                            <td class="border border-black p-2 text-center bg-gray-50">${item.p}</td>
                            <td class="border border-black p-2 text-center bg-gray-50">${item.l}</td>
                            <td class="border border-black p-2 text-center bg-gray-50">${item.t}</td>
                            <td class="border border-black p-2 text-center font-bold">${item.kti}</td>
                            <td class="border border-black p-2">${item.bahan}</td>
                            <td class="border border-black p-2 text-gray-400 text-[10px] text-center">Mula [     ] -> Siap [     ]</td>
                            <td class="border border-black p-2"></td>
                        </tr>
                    `;
                });

                sheetDiv.innerHTML = `
                    <div class="text-center mb-1 font-bold text-sm text-blue-600 no-print">--- PREVIEW DOKUMEN ROUTE SHEET (HALAMAN ${pageNum}/${totalPages}) ---</div>
                    <div class="text-center font-bold text-base text-slate-900 mb-1">BORANG ROUTE SHEET PENGELUARAN</div>
                    ${buildHeaderHTML(wos, batch, mesin, projek, proses, produk, size, tarikh, pageNum, totalPages)}
                    <table class="w-full border-collapse border border-black text-sm">
                        <thead>
                            <tr class="bg-slate-100 text-xs font-bold text-center">
                                <th class="border border-black p-2 w-10" rowspan="2">NO</th>
                                <th class="border border-black p-2 text-left" rowspan="2">KOMPONEN</th>
                                <th class="border border-black p-2" colspan="3">SAIZ (mm)</th>
                                <th class="border border-black p-2 w-16" rowspan="2">KTI</th>
                                <th class="border border-black p-2 text-left" rowspan="2">BAHAN</th>
                                <th class="border border-black p-2 w-36" rowspan="2">STATUS ALIRAN</th>
                                <th class="border border-black p-2 w-24" rowspan="2">PENGESAHAN</th>
                            </tr>
                            <tr class="bg-slate-50 text-[10px] font-bold text-center">
                                <th class="border border-black p-1 w-12">P</th>
                                <th class="border border-black p-1 w-12">L</th>
                                <th class="border border-black p-1 w-12">T</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRowsHTML}
                        </tbody>
                    </table>
                `;
                container.appendChild(sheetDiv);
            }

            // --- JANA BORANG INSPEKSI QC ---
            const qcContainer = document.createElement('div');
            qcContainer.className = "page-break bg-white p-6 shadow-md border border-slate-300 rounded-lg mt-10";
            
            let qcRowsHTML = '';
            let currentGroupInQC = '';

            flatComponentList.forEach(item => {
                if (item.group !== currentGroupInQC) {
                    qcRowsHTML += `
                        <tr class="bg-teal-50 font-bold text-xs">
                            <td colspan="9" class="border border-black px-2 py-1.5 text-teal-900 tracking-wider">SEMAKAN KUMPULAN: ${item.group}</td>
                        </tr>
                    `;
                    currentGroupInQC = item.group;
                }

                qcRowsHTML += `
                    <tr class="text-xs">
                        <td class="border border-black p-2 text-center font-bold">${item.globalNo}</td>
                        <td class="border border-black p-2 font-bold">${item.name} <br><span class="text-[10px] font-normal text-gray-500">${item.bahan}</span></td>
                        <td class="border border-black p-2 text-center bg-slate-100 font-semibold">${item.p} x ${item.l} x ${item.t} (x${item.kti})</td>
                        <td class="border border-black p-2 text-center text-gray-300">[                 ]</td>
                        <td class="border border-black p-2 text-center text-gray-400">OK / Chip</td>
                        <td class="border border-black p-2 text-center text-gray-400">OK / Calar</td>
                        <td class="border border-black p-2 text-center text-gray-400">OK / Ralat</td>
                        <td class="border border-black p-2 text-center font-bold text-gray-400">PASS / FAIL</td>
                        <td class="border border-black p-2"></td>
                    </tr>
                `;
            });

            qcContainer.innerHTML = `
                <div class="text-center mb-1 font-bold text-sm text-teal-600 no-print">--- PREVIEW DOKUMEN KAWALAN KUALITI (QC) ---</div>
                <div class="text-center font-bold text-base text-teal-800 mb-2">BORANG PEMERIKSAAN KUALITI QC (BERASASKAN KUMPULAN)</div>
                ${buildHeaderHTML(wos, batch, mesin, projek, "KAWALAN KUALITI (QC)", produk, size, tarikh, 1, 1)}
                
                <table class="w-full border-collapse border border-black text-sm">
                    <thead>
                        <tr class="bg-teal-900 text-white text-xs font-bold text-center">
                            <th class="border border-black p-2 w-10">NO</th>
                            <th class="border border-black p-2 text-left">NAMA KOMPONEN</th>
                            <th class="border border-black p-2 w-40">SPESIFIKASI SASARAN (mm)</th>
                            <th class="border border-black p-2 w-36">UKURAN SEBENAR</th>
                            <th class="border border-black p-2 w-28">CHIPPING</th>
                            <th class="border border-black p-2 w-28">CALAR (SCRATCH)</th>
                            <th class="border border-black p-2 w-28">KEKEMASAN EDGE</th>
                            <th class="border border-black p-2 w-24">STATUS</th>
                            <th class="border border-black p-2">CATATAN INSPEKTOR</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${qcRowsHTML}
                    </tbody>
                </table>
                <div class="mt-8 grid grid-cols-2 gap-8 text-center text-xs font-bold">
                    <div class="border-t border-black pt-4 mt-6">Tandatangan Pengesah QC: ____________________</div>
                    <div class="border-t border-black pt-4 mt-6">Tarikh Pemeriksaan: ____________________</div>
                </div>
            `;
            container.appendChild(qcContainer);
        }

        // --- ENGINES FOR EXPORT WITH VALIDATION LOCK ---
        function exportToExcel() {
            if (!semakPengepalaWajib()) return; // Kunci proses jika pengepala kosong

            const proj = document.getElementById('namaProjek').value || 'Projek';
            const wb = XLSX.utils.book_new();
            
            let excelData = [
                ["WOS NO:", document.getElementById('wosNo').value, "", "PROJEK:", document.getElementById('namaProjek').value],
                ["BATCH NO:", document.getElementById('batchNo').value, "", "PROSES:", document.getElementById('jenisProses').value],
                ["NAMA MESIN:", document.getElementById('namaMesin').value, "", "NAMA PRODUK:", document.getElementById('namaProduk').value],
                [],
                ["NO SIKEL", "KUMPULAN / GROUP", "NAMA KOMPONEN", "PANJANG (P)", "LEBAR (L)", "TINGGI (T)", "KTI (BIL)", "BAHAN"]
            ];

            let globalIdx = 1;
            document.querySelectorAll('.group-block').forEach(block => {
                const gName = block.querySelector('.group-title-input').value.toUpperCase() || "AM";
                block.querySelectorAll('.comp-row').forEach(row => {
                    excelData.push([
                        globalIdx++,
                        gName,
                        row.querySelector('.c-name').value,
                        row.querySelector('.c-p').value,
                        row.querySelector('.c-l').value,
                        row.querySelector('.c-t').value,
                        row.querySelector('.c-kti').value,
                        row.querySelector('.c-bahan').value
                    ]);
                });
            });

            const ws = XLSX.utils.aoa_to_sheet(excelData);
            XLSX.utils.book_append_sheet(wb, ws, "Data Komponen Berkumpulan");
            XLSX.writeFile(wb, `${proj.replace(/\s+/g, '_')}_Router_Sistem_Kumpulan.xlsx`);
        }

        function exportToPDF() {
            if (!semakPengepalaWajib()) return; // Kunci proses jika pengepala kosong

            const element = document.getElementById('printContainer');
            const proj = document.getElementById('namaProjek').value || 'Dokumen';
            const opt = {
                margin:       0.3,
                filename:     `${proj.replace(/\s+/g, '_')}_Borang_Kumpulan_Produksi.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // Mulakan paparan kosong (Fresh Slate)
        renderOutputs();
    </script>
</body>
</html>
