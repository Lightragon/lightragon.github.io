<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Router Pengeluaran & QC - Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-before: always; break-before: page; }
            body { background-color: white; padding: 0; }
        }
    </style>
</head>
<body class="bg-slate-50 font-sans p-4 md:p-8 text-sm text-gray-800">

    <!-- INPUT PANE (CLERK STATION) -->
    <div class="max-w-7xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-slate-200 no-print mb-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-3 flex items-center gap-2">📋 Meja Kerani Pengeluaran</h1>
        
        <!-- Pengepala Atas Rujukan Book 1(Sheet1).csv -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Nombor WOS</label>
                <input type="text" id="wosNo" value="WOS-2026-001" class="w-full mt-1 p-2 border rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">No Batch</label>
                <input type="text" id="batchNo" value="BATCH-0A" class="w-full mt-1 p-2 border rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Nama Mesin</label>
                <input type="text" id="namaMesin" value="CNC Router 1" class="w-full mt-1 p-2 border rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Nama Projek</label>
                <input type="text" id="namaProjek" value="KABINET DAPUR ALFA" class="w-full mt-1 p-2 border rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Jenis Proses</label>
                <input type="text" id="jenisProses" value="POTONG & EDGE BAND" class="w-full mt-1 p-2 border rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Nama Produk</label>
                <input type="text" id="namaProduk" value="WALL CABINET UNIT A" class="w-full mt-1 p-2 border rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Size Produk / Bil. Unit</label>
                <input type="text" id="sizeProduk" value="900x600x300mm / 2 Unit" class="w-full mt-1 p-2 border rounded bg-white" oninput="renderOutputs()">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Tarikh</label>
                <input type="date" id="tarikhDoc" class="w-full mt-1 p-2 border rounded bg-white" oninput="renderOutputs()">
            </div>
        </div>

        <!-- Borang Input Komponen -->
        <h2 class="text-lg font-bold text-slate-700 mb-2">🔧 Senarai Komponen (Isi Sekali Sahaja)</h2>
        <div class="overflow-x-auto mb-4">
            <table class="w-full text-left border">
                <thead>
                    <tr class="bg-slate-800 text-white text-xs uppercase">
                        <th class="p-2 border">Kategori/Group (cth: LANTAI)</th>
                        <th class="p-2 border">Nama Komponen</th>
                        <th class="p-2 border w-20">P (mm)</th>
                        <th class="p-2 border w-20">L (mm)</th>
                        <th class="p-2 border w-20">T (mm)</th>
                        <th class="p-2 border w-20">KTI (Bil)</th>
                        <th class="p-2 border">Bahan</th>
                        <th class="p-2 border w-16 text-center">Padam</th>
                    </tr>
                </thead>
                <tbody id="inputRows">
                    <tr class="item-row bg-white">
                        <td class="p-1 border"><input type="text" value="LANTAI" class="w-full p-1 border rounded comp-group" oninput="renderOutputs()"></td>
                        <td class="p-1 border"><input type="text" value="Panel Tapak Utama" class="w-full p-1 border rounded comp-name" oninput="renderOutputs()"></td>
                        <td class="p-1 border"><input type="number" value="864" class="w-full p-1 border rounded comp-p" oninput="renderOutputs()"></td>
                        <td class="p-1 border"><input type="number" value="280" class="w-full p-1 border rounded comp-l" oninput="renderOutputs()"></td>
                        <td class="p-1 border"><input type="number" value="18" class="w-full p-1 border rounded comp-t" oninput="renderOutputs()"></td>
                        <td class="p-1 border"><input type="number" value="2" class="w-full p-1 border rounded comp-kti" oninput="renderOutputs()"></td>
                        <td class="p-1 border"><input type="text" value="MFC Board White" class="w-full p-1 border rounded comp-bahan" oninput="renderOutputs()"></td>
                        <td class="p-1 border text-center"><button onclick="deleteRow(this)" class="text-red-500 hover:text-red-700 font-bold">✕</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="flex flex-wrap gap-3 mb-6">
            <button onclick="addRow()" class="bg-slate-700 text-white px-4 py-2 rounded shadow hover:bg-slate-800 font-medium">+ Tambah Komponen</button>
            <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded shadow hover:bg-emerald-700 font-medium">📥 Eksport Excel (.xlsx)</button>
            <button onclick="exportToPDF()" class="bg-rose-600 text-white px-4 py-2 rounded shadow hover:bg-rose-700 font-medium">📄 Muat Turun Cetakan PDF</button>
        </div>
    </div>

    <!-- PREVIEW & LIVE PRINTSYSTEM -->
    <div id="printContainer" class="max-w-7xl mx-auto space-y-8">
        <!-- Konten Di-generate Secara Dinamik oleh JavaScript -->
    </div>

    <script>
        // Set tarikh hari ini secara automatik
        document.getElementById('tarikhDoc').value = new Date().toISOString().split('T')[0];

        function addRow() {
            const tbody = document.getElementById('inputRows');
            const tr = document.createElement('tr');
            tr.className = 'item-row bg-white';
            tr.innerHTML = `
                <td class="p-1 border"><input type="text" placeholder="cth: LANTAI" class="w-full p-1 border rounded comp-group" oninput="renderOutputs()"></td>
                <td class="p-1 border"><input type="text" placeholder="Nama komponen" class="w-full p-1 border rounded comp-name" oninput="renderOutputs()"></td>
                <td class="p-1 border"><input type="number" placeholder="0" class="w-full p-1 border rounded comp-p" oninput="renderOutputs()"></td>
                <td class="p-1 border"><input type="number" placeholder="0" class="w-full p-1 border rounded comp-l" oninput="renderOutputs()"></td>
                <td class="p-1 border"><input type="number" placeholder="0" class="w-full p-1 border rounded comp-t" oninput="renderOutputs()"></td>
                <td class="p-1 border"><input type="number" placeholder="0" class="w-full p-1 border rounded comp-kti" oninput="renderOutputs()"></td>
                <td class="p-1 border"><input type="text" placeholder="Jenis bahan" class="w-full p-1 border rounded comp-bahan" oninput="renderOutputs()"></td>
                <td class="p-1 border text-center"><button onclick="deleteRow(this)" class="text-red-500 hover:text-red-700 font-bold">✕</button></td>
            `;
            tbody.appendChild(tr);
            renderOutputs();
        }

        function deleteRow(btn) {
            btn.closest('tr').remove();
            renderOutputs();
        }

        function buildHeaderHTML(wos, batch, mesin, projek, proses, produk, size, tarikh, pageNum, totalPages) {
            return `
                <div class="grid grid-cols-12 border border-black text-xs font-bold mb-4 bg-white p-2">
                    <div class="col-span-3 border-r border-b border-black p-1">WOS NO: <span class="font-normal">${wos}</span></div>
                    <div class="col-span-4 border-r border-b border-black p-1">PROJEK: <span class="font-normal">${projek}</span></div>
                    <div class="col-span-5 border-b border-black p-1">NAMA PROJEK: <span class="font-normal">${projek}</span></div>
                    
                    <div class="col-span-3 border-r border-b border-black p-1">BATCH NO: <span class="font-normal">${batch}</span></div>
                    <div class="col-span-4 border-r border-b border-black p-1">PROSES: <span class="font-normal">${proses}</span></div>
                    <div class="col-span-5 border-b border-black p-1">TARIKH: <span class="font-normal">${tarikh}</span></div>
                    
                    <div class="col-span-3 border-r border-black p-1">NAMA MESIN: <span class="font-normal">${mesin}</span></div>
                    <div class="col-span-4 border-r border-black p-1">NAMA PRODUK: <span class="font-normal">${produk}</span></div>
                    <div class="col-span-3 border-r border-black p-1">SAIZ / BIL UNIT: <span class="font-normal">${size}</span></div>
                    <div class="col-span-2 p-1 text-right">Muka Surat: <span class="font-normal">${pageNum} / ${totalPages}</span></div>
                </div>
            `;
        }

        function renderOutputs() {
            const container = document.getElementById('printContainer');
            container.innerHTML = '';

            // Ambil data metadata utama
            const wos = document.getElementById('wosNo').value;
            const batch = document.getElementById('batchNo').value;
            const mesin = document.getElementById('namaMesin').value;
            const projek = document.getElementById('namaProjek').value;
            const proses = document.getElementById('jenisProses').value;
            const produk = document.getElementById('namaProduk').value;
            const size = document.getElementById('sizeProduk').value;
            const tarikh = document.getElementById('tarikhDoc').value;

            // Kumpul senarai komponen
            const rows = document.querySelectorAll('.item-row');
            let components = [];
            rows.forEach((row, idx) => {
                components.push({
                    no: idx + 1,
                    group: row.querySelector('.comp-group').value.toUpperCase() || 'AM',
                    name: row.querySelector('.comp-name').value || '---',
                    p: row.querySelector('.comp-p').value || '-',
                    l: row.querySelector('.comp-l').value || '-',
                    t: row.querySelector('.comp-t').value || '-',
                    kti: row.querySelector('.comp-kti').value || '0',
                    bahan: row.querySelector('.comp-bahan').value || '-'
                });
            });

            if(components.length === 0) return;

            // PAGINATION LOGIC FOR ROUTE SHEET (Maksimum 8 baris satu halaman supaya tak overflow)
            const ITEMS_PER_PAGE = 8;
            const totalPages = Math.ceil(components.length / ITEMS_PER_PAGE);

            for (let i = 0; i < totalPages; i++) {
                const pageNum = i + 1;
                const sliceStart = i * ITEMS_PER_PAGE;
                const pageItems = components.slice(sliceStart, sliceStart + ITEMS_PER_PAGE);

                const sheetDiv = document.createElement('div');
                sheetDiv.className = `bg-white p-6 shadow-md border border-slate-300 rounded-lg ${i > 0 ? 'page-break' : ''}`;
                
                let tableRowsHTML = '';
                let lastGroup = '';

                pageItems.forEach(item => {
                    // Masukkan pembahagi jika group bertukar (seperti LANTAI, TAPAK dll)
                    if (item.group && item.group !== lastGroup) {
                        tableRowsHTML += `
                            <tr class="bg-amber-50 font-bold">
                                <td colspan="9" class="border border-black px-2 py-1 text-amber-900 text-xs tracking-wider">🎯 BAHAGIAN / GROUP: ${item.group}</td>
                            </tr>
                        `;
                        lastGroup = item.group;
                    }

                    tableRowsHTML += `
                        <tr class="text-xs">
                            <td class="border border-black p-2 text-center font-bold">${item.no}</td>
                            <td class="border border-black p-2 font-medium">${item.name}</td>
                            <td class="border border-black p-2 text-center bg-gray-50">${item.p}</td>
                            <td class="border border-black p-2 text-center bg-gray-50">${item.l}</td>
                            <td class="border border-black p-2 text-center bg-gray-50">${item.t}</td>
                            <td class="border border-black p-2 text-center font-bold">${item.kti}</td>
                            <td class="border border-black p-2">${item.bahan}</td>
                            <td class="border border-black p-2 text-gray-400 text-[10px] text-center">Mula [ &nbsp; ] → Siap [ &nbsp; ]</td>
                            <td class="border border-black p-2"></td>
                        </tr>
                    `;
                });

                sheetDiv.innerHTML = `
                    <div class="text-center mb-2 font-bold text-lg tracking-wide uppercase text-slate-900 no-print">--- HALAMAN CETAKAN ROUTE SHEET ${pageNum} ---</div>
                    ${buildHeaderHTML(wos, batch, mesin, projek, proses, produk, size, tarikh, pageNum, totalPages)}
                    <table class="w-full border-collapse border border-black text-sm">
                        <thead>
                            <tr class="bg-slate-100 text-xs font-bold text-center">
                                <th class="border border-black p-2 w-10" rowspan="2">NO</th>
                                <th class="border border-black p-2 text-left" rowspan="2">KOMPONEN</th>
                                <th class="border border-black p-2" colspan="3">SAIZ (mm)</th>
                                <th class="border border-black p-2 w-16" rowspan="2">KTI</th>
                                <th class="border border-black p-2 text-left" rowspan="2">BAHAN</th>
                                <th class="border border-black p-2 w-36" rowspan="2">STATUS ALIRAN</th>
                                <th class="border border-black p-2 w-24" rowspan="2">PENGESAHAN</th>
                            </tr>
                            <tr class="bg-slate-50 text-[10px] font-bold text-center">
                                <th class="border border-black p-1 w-12">P</th>
                                <th class="border border-black p-1 w-12">L</th>
                                <th class="border border-black p-1 w-12">T</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRowsHTML}
                        </tbody>
                    </table>
                `;
                container.appendChild(sheetDiv);
            }

            // ================= BORANG INSPEKSI QC INDIVIDU FOR EACH COMPONENT =================
            // Setiap komponen dapat satu baris borang audit yang lengkap
            const qcContainer = document.createElement('div');
            qcContainer.className = "page-break bg-white p-6 shadow-md border border-slate-300 rounded-lg mt-10";
            
            let qcRowsHTML = '';
            components.forEach(item => {
                qcRowsHTML += `
                    <tr class="text-xs">
                        <td class="border border-black p-2 text-center font-bold">${item.no}</td>
                        <td class="border border-black p-2 font-bold">${item.name} <br><span class="text-[10px] font-normal text-gray-500">${item.group} | ${item.bahan}</span></td>
                        <!-- Specs Asal -->
                        <td class="border border-black p-2 text-center bg-slate-100 font-semibold">${item.p} x ${item.l} x ${item.t}</td>
                        <!-- Pemeriksaan QC -->
                        <td class="border border-black p-2 text-center text-gray-300">[ &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ]</td>
                        <td class="border border-black p-2 text-center text-gray-400">👌 OK / ❌ Chip</td>
                        <td class="border border-black p-2 text-center text-gray-400">👌 OK / ❌ Calar</td>
                        <td class="border border-black p-2 text-center text-gray-400">👌 OK / ❌ Ralat</td>
                        <td class="border border-black p-2 text-center font-bold text-gray-400">PASS / FAIL</td>
                        <td class="border border-black p-2"></td>
                    </tr>
                `;
            });

            qcContainer.innerHTML = `
                <div class="text-center mb-2 font-bold text-lg tracking-wide uppercase text-teal-900 no-print">--- BORANG INSPEKSI KUALITI QC ---</div>
                <div class="text-center font-bold text-base text-teal-800 mb-2">BORANG PEMERIKSAAN KUALITI QC (SETIAP KOMPONEN)</div>
                ${buildHeaderHTML(wos, batch, mesin, projek, "KAWALAN KUALITI (QC)", produk, size, tarikh, 1, 1)}
                
                <table class="w-full border-collapse border border-black text-sm">
                    <thead>
                        <tr class="bg-teal-900 text-white text-xs font-bold text-center">
                            <th class="border border-black p-2 w-10">NO</th>
                            <th class="border border-black p-2 text-left">NAMA KOMPONEN</th>
                            <th class="border border-black p-2 w-32">SPESIFIKASI ASAL (mm)</th>
                            <th class="border border-black p-2 w-32">UKURAN SEBENAR</th>
                            <th class="border border-black p-2 w-28">CHIPPING</th>
                            <th class="border border-black p-2 w-28">CALAR (SCRATCH)</th>
                            <th class="border border-black p-2 w-28">KEKEMASAN EDGE</th>
                            <th class="border border-black p-2 w-24">STATUS</th>
                            <th class="border border-black p-2">CATATAN INSPEKTOR</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${qcRowsHTML}
                    </tbody>
                </table>
                <div class="mt-8 grid grid-cols-2 gap-8 text-center text-xs font-bold">
                    <div class="border-t border-black pt-4 mt-8">Tandatangan QC Operator: ____________________</div>
                    <div class="border-t border-black pt-4 mt-8">Tarikh Pemeriksaan: ____________________</div>
                </div>
            `;
            container.appendChild(qcContainer);
        }

        // --- ENGINES FOR EXPORT ---
        function exportToExcel() {
            const proj = document.getElementById('namaProjek').value || 'Projek';
            const wb = XLSX.utils.book_new();
            
            let rawData = [
                ["WOS NO:", document.getElementById('wosNo').value, "", "PROJEK:", document.getElementById('namaProjek').value],
                ["BATCH NO:", document.getElementById('batchNo').value, "", "PROSES:", document.getElementById('jenisProses').value],
                ["NAMA MESIN:", document.getElementById('namaMesin').value, "", "NAMA PRODUK:", document.getElementById('namaProduk').value],
                [],
                ["NO", "GROUP", "KOMPONEN", "P (mm)", "L (mm)", "T (mm)", "KTI", "BAHAN"]
            ];

            document.querySelectorAll('.item-row').forEach((row, idx) => {
                rawData.push([
                    idx + 1,
                    row.querySelector('.comp-group').value,
                    row.querySelector('.comp-name').value,
                    row.querySelector('.comp-p').value,
                    row.querySelector('.comp-l').value,
                    row.querySelector('.comp-t').value,
                    row.querySelector('.comp-kti').value,
                    row.querySelector('.comp-bahan').value
                ]);
            });

            const ws = XLSX.utils.aoa_to_sheet(rawData);
            XLSX.utils.book_append_sheet(wb, ws, "Data Pengeluaran");
            XLSX.writeFile(wb, `${proj.replace(/\s+/g, '_')}_Router_QC.xlsx`);
        }

        function exportToPDF() {
            const element = document.getElementById('printContainer');
            const proj = document.getElementById('namaProjek').value || 'Dokumen';
            const opt = {
                margin:       0.3,
                filename:     `${proj.replace(/\s+/g, '_')}_Borang_Produksi.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // Jalankan render automatik semasa load awal
        renderOutputs();
    </script>
</body>
</html>
